workflows:
  react-native-android-dev:
    name: React Native Android Dev Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev-branch
          include: true
          source: true
    environment:
      android_signing:
        - newsapp
      groups:
        - myself
      vars:
        PACKAGE_NAME: "com.newsapp"
        TESTFAIRY_API_KEY: $TESTFAIRY_API_KEY
        node: v18.16.1

    scripts:
      - name: Run full build process with version check
        script: |
          set -e

          # echo "Fetching full git history..."
          # git fetch --unshallow || git fetch --all

          echo "Checking for version changes in build.gradle..."
          VERSION_CHANGE=$(git diff HEAD~1 -G "versionCode|versionName" -- android/app/build.gradle | wc -l)
          if [ "$VERSION_CHANGE" -eq 0 ]; then
            echo "✅ No version change detected. Skipping build and upload."
            exit 0
          fi

          echo "✅ Version change detected. Continuing build process..."
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | awk '{print $2}' | tr -d '"')
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | awk '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE"

          echo "Exporting to CM_ENV..."
          echo "VERSION_NAME=$VERSION_NAME" >> $CM_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $CM_ENV

          echo "Installing dependencies..."
          npm install

          echo "Setting Android SDK path..."
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

          echo "Building APK..."
          cd android
          ./gradlew clean assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME
          cd ..

          echo "Uploading to TestFairy..."
          APK_FILE_PATH="android/app/build/outputs/apk/release/app-release.apk"
          curl -X POST https://upload.testfairy.com/api/upload \
            -F api_key="$TESTFAIRY_API_KEY" \
            -F file=@"$APK_FILE_PATH" \
            -F groups="myself" \
            -F notify="on" \
            -F auto_update="true"

    artifacts:
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - gopal.gupta.v2stech@gmail.com
          - shubham.singh.v2stech@gmail.com
        notify:
          success: true
          failure: false
