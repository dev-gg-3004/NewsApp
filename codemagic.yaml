workflows:
  react-native-android-dev:
    name: React Native Android Dev Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: dev-branch
          include: true
          source: true
    environment:
      android_signing:
        - newsapp
      groups:
        - myself
      vars:
        PACKAGE_NAME: "com.newsapp"
        TESTFAIRY_API_KEY: "$TESTFAIRY_API_KEY"
        node: v18.16.1
    scripts:
      - name: Check version change
        script: |
          VERSION_CHANGE=$(git diff HEAD~1 -G "versionCode|versionName" -- android/app/build.gradle | wc -l)
          if [ "$VERSION_CHANGE" -eq 0 ]; then
            echo "No version change detected. Skipping build and upload."
            exit 0
          fi

          touch .version_changed
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | awk '{print $2}' | tr -d '"')
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | awk '{print $2}')
          echo "VERSION_NAME=$VERSION_NAME" >> $CM_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $CM_ENV

      - name: Install dependencies
        script: |
          npm install

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build APK
        script: |
          cd android
          ./gradlew clean assembleRelease \
            -PversionCode=$VERSION_CODE \
            -PversionName=$VERSION_NAME

      - name: Upload to TestFairy (only if version changed)
        script: |
          if [ ! -f .version_changed ]; then
            echo "Skipping TestFairy upload — no version change."
            exit 0
          fi

          APK_FILE_PATH="android/app/build/outputs/apk/release/app-release.apk"
          echo "Uploading $APK_FILE_PATH to TestFairy..."

          RESPONSE=$(curl -X POST https://upload.testfairy.com/api/upload \
            -F api_key="$TESTFAIRY_API_KEY" \
            -F file=@"$APK_FILE_PATH" \
            -F groups="myself" \
            -F notify="on" \
            -F auto_update="true")

          echo "$RESPONSE"

    artifacts:
      - .version_changed
      - android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - gopal.gupta.v2stech@gmail.com
          - shubham.singh.v2stech@gmail.com
        notify:
          success: true
          failure: false
